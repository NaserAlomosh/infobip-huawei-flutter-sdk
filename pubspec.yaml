name: infobip_mobilemessaging_huawei
description: Android Flutter plugin infrastructure for the Infobip Huawei Mobile Messaging SDK.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.infobip.mobilemessaging.huawei
        pluginClass: InfobipMobileMessagingHuaweiPlugin
